name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test + coverage + perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache native kotlinc (optional)
        id: cache-native
        uses: actions/cache@v4
        with:
          path: ~/.kscriptx/native-kotlinc
          key: native-kotlinc-${{ runner.os }}-kotlin-2.4.10-${{ hashFiles('scripts/build-native-kotlinc.sh', 'scripts/native-kotlinc/**') }}
          restore-keys: |
            native-kotlinc-${{ runner.os }}-kotlin-2.4.10-

      - name: Unit tests + JaCoCo coverage
        run: |
          chmod +x gradlew scripts/*.sh
          ./gradlew :cli:coverage --no-daemon

      - name: Build CLI distribution
        run: ./gradlew :cli:build --no-daemon

      - name: Smoke-run hello (requires native kotlinc)
        run: |
          set -euo pipefail
          if [[ -x "$HOME/.kscriptx/native-kotlinc/kotlinc-native" ]]; then
            export KSCRIPTX_NATIVE_KOTLINC="$HOME/.kscriptx/native-kotlinc"
            ./bin/kscriptx --no-daemon examples/hello-nodeps.kts
            ./bin/kscriptx --no-daemon examples/hello.kts
          else
            echo "Skipping script smoke (native kotlinc not cached — build locally or warm cache key)."
          fi

      - name: CLI performance bench
        run: ./scripts/bench.sh build/reports/perf

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## kscriptx CI"
            echo
            echo "### Tests"
            if [[ -d cli/build/test-results/test ]]; then
              echo "| Result | Count |"
              echo "|---|---:|"
              total=0; fails=0; errors=0; skipped=0
              for p in cli/build/test-results/test/TEST-*.xml; do
                [[ -f "$p" ]] || continue
                t=$(grep -oP 'tests="\K[0-9]+' "$p" | head -1 || echo 0)
                f=$(grep -oP 'failures="\K[0-9]+' "$p" | head -1 || echo 0)
                e=$(grep -oP 'errors="\K[0-9]+' "$p" | head -1 || echo 0)
                s=$(grep -oP 'skipped="\K[0-9]+' "$p" | head -1 || echo 0)
                total=$((total + t))
                fails=$((fails + f))
                errors=$((errors + e))
                skipped=$((skipped + s))
              done
              echo "| Total | $total |"
              echo "| Failures | $fails |"
              echo "| Errors | $errors |"
              echo "| Skipped | $skipped |"
              echo
            else
              echo "_No JUnit XML found._"
              echo
            fi

            XML="cli/build/reports/jacoco/test/jacocoTestReport.xml"
            if [[ -f "$XML" ]]; then
              ./scripts/coverage-summary.sh "$XML"
            else
              echo "### Coverage"
              echo
              echo "_JaCoCo XML not found._"
              echo
            fi

            if [[ -f cli/build/reports/perf/microbench.md ]]; then
              cat cli/build/reports/perf/microbench.md
            fi

            if [[ -f build/reports/perf/cli-bench.md ]]; then
              cat build/reports/perf/cli-bench.md
            fi

            if [[ -x "$HOME/.kscriptx/native-kotlinc/kotlinc-native" ]]; then
              echo "Native kotlinc: **cached/present** — cold/warm script timings included."
            else
              echo "Native kotlinc: **not present** — cold/warm script timings skipped (cache miss)."
            fi
            echo
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-reports
          path: |
            cli/build/reports/tests/
            cli/build/reports/jacoco/
            cli/build/test-results/
            cli/build/reports/perf/
            build/reports/perf/
          if-no-files-found: warn
          retention-days: 7
