name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0). Creates tag v<version> if missing."
        required: true
        type: string
      build_native:
        description: "Also build Linux native kotlinc (needs lots of RAM; may fail on small runners)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "tag=v$V" >>"$GITHUB_OUTPUT"
          echo "Releasing $V (tag v$V)"

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and package (tar + deb)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x gradlew scripts/*.sh
          # Align Gradle project version with release tag
          sed -i -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" cli/build.gradle.kts
          ./scripts/package-dist.sh "$VERSION"
          ./scripts/package-tarball.sh "$VERSION"
          ./scripts/package-deb.sh "$VERSION"
          ls -lh dist/

      - name: Build native kotlinc (optional, heavy)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_native }}
        continue-on-error: true
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # GraalVM CE via SDKMAN — needs several GB RAM; may OOM on free runners
          curl -s "https://get.sdkman.io" | bash
          source "$HOME/.sdkman/bin/sdkman-init.sh"
          sdk install java 21.0.2-graalce </dev/null || true
          sdk use java 21.0.2-graalce
          export JAVA_HOME="$SDKMAN_DIR/candidates/java/current"
          export PATH="$JAVA_HOME/bin:$PATH"
          export NATIVE_IMAGE_OPTIONS="-J-Xmx5g"
          ./scripts/build-native-kotlinc.sh
          ./scripts/package-native-kotlinc.sh "$VERSION"
          ls -lh dist/

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows zip
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x gradlew scripts/*.sh || true
          sed -i -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" cli/build.gradle.kts
          ./gradlew :cli:build --quiet
          ./scripts/package-dist.sh "$VERSION"
          ./scripts/package-windows.sh "$VERSION"
          ls -lh dist/

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        run: |
          mkdir -p assets
          find release-assets -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -exec cp -v {} assets/ \;
          ls -lh assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Ensure tag exists for workflow_dispatch
          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          NOTES="$(mktemp)"
          {
            echo "## kscriptx ${VERSION}"
            echo
            echo "### Packages"
            echo "- **Debian/Ubuntu:** \`kscriptx_${VERSION}_all.deb\` — \`sudo apt install ./kscriptx_${VERSION}_all.deb\`"
            echo "- **Linux portable:** \`kscriptx-${VERSION}-linux-amd64.tar.gz\`"
            echo "- **Windows portable:** \`kscriptx-${VERSION}-windows-amd64.zip\` (JDK 17+ required)"
            echo "- **Native kotlinc (Linux amd64):** \`kscriptx-native-kotlinc-${VERSION}-linux-amd64.tar.gz\` (if built)"
            echo
            echo "After installing the CLI, install native kotlinc under \`~/.kscriptx/native-kotlinc\` (required for script compiles). See README."
          } >"$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" assets/* \
              --title "kscriptx ${VERSION}" \
              --notes-file "$NOTES"
          fi
