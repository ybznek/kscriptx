name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1). Creates tag v<version> if missing."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "tag=v$V" >>"$GITHUB_OUTPUT"
          echo "Releasing $V (tag v$V)"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM CE 21 (native-image)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CLI + native kotlinc + packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          NATIVE_IMAGE_OPTIONS: "-J-Xmx5g"
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/*.sh
          sed -i -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" cli/build.gradle.kts
          ./gradlew :cli:build --quiet

          echo "==> building native kotlinc (${ARCH})"
          INSTALL_DIR="$HOME/.kscriptx/native-kotlinc" ./scripts/build-native-kotlinc.sh
          test -x "$HOME/.kscriptx/native-kotlinc/kotlinc-native"

          export INCLUDE_NATIVE=1
          export NATIVE_DIR="$HOME/.kscriptx/native-kotlinc"
          export ARCH
          ./scripts/package-dist.sh "$VERSION"
          ./scripts/package-tarball.sh "$VERSION" "$ARCH"
          ./scripts/package-deb.sh "$VERSION" "$NATIVE_DIR"
          ./scripts/package-native-kotlinc.sh "$VERSION" "$NATIVE_DIR" "$ARCH"
          # Portable windows zip only from amd64 job (JVM jars)
          if [[ "$ARCH" == "amd64" ]]; then
            ./scripts/package-windows.sh "$VERSION"
          fi
          ls -lh dist/
          test -f "dist/kscriptx_${VERSION}_${ARCH}.deb"
          test -f "dist/kscriptx-${VERSION}-linux-${ARCH}.tar.gz"
          test -x "dist/kscriptx-${VERSION}/bin/native-kotlinc/kotlinc-native"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows zip
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x gradlew scripts/*.sh || true
          sed -i -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" cli/build.gradle.kts
          ./gradlew :cli:build --quiet
          ./scripts/package-dist.sh "$VERSION"
          ./scripts/package-windows.sh "$VERSION"
          ls -lh dist/
          test -f "dist/kscriptx-${VERSION}-windows-amd64.zip"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Flatten assets
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p assets
          find release-assets -type f \( -name '*.deb' -o -name '*.tar.gz' -o -name '*.zip' \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              if [[ ! -e "assets/$base" ]]; then
                cp -v "$f" "assets/$base"
              fi
            done
          ls -lh assets/
          test -f "assets/kscriptx_${VERSION}_amd64.deb"
          test -f "assets/kscriptx_${VERSION}_arm64.deb"
          test -f "assets/kscriptx-${VERSION}-linux-amd64.tar.gz"
          test -f "assets/kscriptx-${VERSION}-linux-arm64.tar.gz"
          test -f "assets/kscriptx-${VERSION}-windows-amd64.zip"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          NOTES="$(mktemp)"
          {
            echo "## kscriptx ${VERSION}"
            echo
            echo "### Packages"
            echo "- **Debian/Ubuntu amd64:** \`kscriptx_${VERSION}_amd64.deb\` — includes native kotlinc"
            echo "- **Debian/Ubuntu arm64 (Raspberry Pi):** \`kscriptx_${VERSION}_arm64.deb\` — includes native kotlinc"
            echo "- **Linux portable amd64/arm64:** \`kscriptx-${VERSION}-linux-*.tar.gz\` (native included)"
            echo "- **Windows portable:** \`kscriptx-${VERSION}-windows-amd64.zip\` (JDK 17+; native kotlinc not bundled)"
            echo
            echo "Debian install:"
            echo
            echo '```bash'
            echo "sudo apt install ./kscriptx_${VERSION}_amd64.deb   # or _arm64.deb"
            echo "kscriptx examples/hello.kts"
            echo '```'
          } >"$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" assets/* \
              --title "kscriptx ${VERSION}" \
              --notes-file "$NOTES"
          fi
