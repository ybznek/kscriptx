name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.2). Creates tag v<version> if missing."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ inputs.version }}"
          else
            V="${GITHUB_REF_NAME}"
          fi
          V="${V#v}"
          echo "version=$V" >>"$GITHUB_OUTPUT"
          echo "tag=v$V" >>"$GITHUB_OUTPUT"
          echo "Releasing $V (tag v$V)"

  prepare:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! git ls-remote --tags origin "refs/tags/${TAG}" | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          NOTES="$(mktemp)"
          {
            echo "## kscriptx ${VERSION}"
            echo
            echo "_Building packages… assets will appear as jobs finish._"
            echo
            echo "### Packages"
            echo "- **Debian/Ubuntu amd64:** \`kscriptx_${VERSION}_amd64.deb\` — includes native kotlinc"
            echo "- **Debian/Ubuntu arm64 (Raspberry Pi):** \`kscriptx_${VERSION}_arm64.deb\` — includes native kotlinc"
            echo "- **Linux portable amd64/arm64:** \`kscriptx-${VERSION}-linux-*.tar.gz\` (native included)"
            echo "- **Windows portable:** \`kscriptx-${VERSION}-windows-amd64.zip\` (JDK 17+; native kotlinc not bundled)"
          } >"$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --draft=false
          else
            gh release create "$TAG" --title "kscriptx ${VERSION}" --notes-file "$NOTES"
          fi

  linux:
    needs: [version, prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM CE (native-image)
        uses: graalvm/setup-graalvm@v1
        with:
          # setup-graalvm does not accept "latest"; pin major and bump intentionally.
          java-version: "25"
          distribution: "graalvm-community"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-24.04-arm is ~8GB RAM; GraalVM 25 native-image for kotlinc needs more.
      - name: Add swap for native-image (arm64)
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          SWAP=/mnt/kscriptx-swap
          sudo swapoff "$SWAP" 2>/dev/null || true
          sudo rm -f "$SWAP"
          sudo fallocate -l 12G "$SWAP" || sudo dd if=/dev/zero of="$SWAP" bs=1M count=12288
          sudo chmod 600 "$SWAP"
          sudo mkswap "$SWAP"
          sudo swapon "$SWAP"
          free -h

      - name: Build CLI + native kotlinc + packages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
          # Do not cap -Xmx: a fixed 5g OOM'd amd64 analysis. Let Graal use ~80% of RAM;
          # arm64 relies on the swap step above.
          ENSURE_LATEST_GRAAL: "0"
        run: |
          set -euo pipefail
          chmod +x gradlew scripts/*.sh
          sed -i -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" cli/build.gradle.kts
          ./gradlew :cli:build --quiet

          echo "==> building native kotlinc (${ARCH})"
          # setup-graalvm exports JAVA_HOME / GRAALVM_HOME
          export GRAALVM_HOME="${GRAALVM_HOME:-$JAVA_HOME}"
          INSTALL_DIR="$HOME/.kscriptx/native-kotlinc" ./scripts/build-native-kotlinc.sh
          test -x "$HOME/.kscriptx/native-kotlinc/kotlinc-native"

          export INCLUDE_NATIVE=1
          export NATIVE_DIR="$HOME/.kscriptx/native-kotlinc"
          export ARCH
          ./scripts/package-dist.sh "$VERSION"
          ./scripts/package-tarball.sh "$VERSION" "$ARCH"
          ./scripts/package-deb.sh "$VERSION" "$NATIVE_DIR"
          # Skip separate native-only tarball (already inside deb + linux tarball)
          ls -lh dist/
          test -f "dist/kscriptx_${VERSION}_${ARCH}.deb"
          test -f "dist/kscriptx-${VERSION}-linux-${ARCH}.tar.gz"
          test -x "dist/kscriptx-${VERSION}/bin/native-kotlinc/kotlinc-native"

      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dist/kscriptx_${VERSION}_${ARCH}.deb" \
            "dist/kscriptx-${VERSION}-linux-${ARCH}.tar.gz" \
            --clobber

  windows:
    needs: [version, prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Windows zip
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          chmod +x gradlew scripts/*.sh || true
          sed -i -E "s/version = \"[^\"]+\"/version = \"${VERSION}\"/" cli/build.gradle.kts
          ./gradlew :cli:build --quiet
          ./scripts/package-dist.sh "$VERSION"
          ./scripts/package-windows.sh "$VERSION"
          ls -lh dist/
          test -f "dist/kscriptx-${VERSION}-windows-amd64.zip"

      - name: Upload assets to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dist/kscriptx-${VERSION}-windows-amd64.zip" \
            --clobber

  finalize:
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          {
            echo "## kscriptx ${VERSION}"
            echo
            echo "### Packages"
            echo "- **Debian/Ubuntu amd64:** \`kscriptx_${VERSION}_amd64.deb\` — includes native kotlinc"
            echo "- **Debian/Ubuntu arm64 (Raspberry Pi):** \`kscriptx_${VERSION}_arm64.deb\` — includes native kotlinc"
            echo "- **Linux portable amd64/arm64:** \`kscriptx-${VERSION}-linux-*.tar.gz\` (native included)"
            echo "- **Windows portable:** \`kscriptx-${VERSION}-windows-amd64.zip\` (JDK 17+; native kotlinc not bundled)"
            echo
            echo "Debian install:"
            echo
            echo '```bash'
            echo "sudo apt install ./kscriptx_${VERSION}_amd64.deb   # or _arm64.deb"
            echo "kscriptx examples/hello.kts"
            echo '```'
          } >"$NOTES"
          gh release edit "$TAG" --notes-file "$NOTES" --draft=false
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$assets"
          for need in \
            "kscriptx_${VERSION}_amd64.deb" \
            "kscriptx_${VERSION}_arm64.deb" \
            "kscriptx-${VERSION}-linux-amd64.tar.gz" \
            "kscriptx-${VERSION}-linux-arm64.tar.gz" \
            "kscriptx-${VERSION}-windows-amd64.zip"
          do
            echo "$assets" | grep -Fxq "$need" || { echo "missing asset: $need" >&2; exit 1; }
          done
