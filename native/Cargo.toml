[package]
name = "kscriptx-native"
version = "0.1.3"
edition = "2021"
description = "Native helpers for kscriptx (daemon client, coverage summary)"
license = "MIT"
publish = false

[[bin]]
name = "kscriptx-dclient"
path = "src/bin/kscriptx_dclient.rs"

[[bin]]
name = "kscriptx-coverage"
path = "src/bin/kscriptx_coverage.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
